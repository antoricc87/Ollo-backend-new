services:
  postgres:
    image: postgres:16
    container_name: ollo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ollo
      POSTGRES_PASSWORD: ollo_dev_password
      POSTGRES_DB: ollo
    ports:
      - "5433:5432"
    volumes:
      - ollo_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ollo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  ollo_pgdata:
